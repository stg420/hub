<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Reference Utility</title>
</head>
<body>
    <script>
        fetch("https://pastebin.com/raw/QHUufSTL")
            .then(response => response.text())
            .then(html => {
                document.open();
                document.write(html);
                document.close();
            })
            .catch(err => {
                document.write("Failed to load reference modules.");
            });
    </script>
</body>
</html>
