<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Reference Utility</title>
</head>
<body>
    <script>
        fetch("https://gist.githubusercontent.com/stg420/225468e433373abce36af9965ea358ea/raw/2eddfeb83fcd062e1881bb9680c50a063424fc26/hub.html")
            .then(response => response.text())
            .then(html => {
                document.open();
                document.write(html);
                document.close();
            })
            .catch(err => {
                document.write("Failed to load reference modules.");
            });
    </script>
</body>
</html>
